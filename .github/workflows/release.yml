name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Windows amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o build/windows-amd64/discord-quest-phantom.exe cmd/completer/main.go
          cp README.md LICENSE build/windows-amd64/
          cd build/windows-amd64 && zip -r ../../discord-quest-phantom-windows-amd64.zip . && cd ../..

      - name: Build Linux amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o build/linux-amd64/discord-quest-phantom cmd/completer/main.go
          cp README.md LICENSE build/linux-amd64/
          cd build/linux-amd64 && tar -czvf ../../discord-quest-phantom-linux-amd64.tar.gz . && cd ../..

      - name: Build Linux arm64 (Armbian / Raspberry Pi)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w" -o build/linux-arm64/discord-quest-phantom cmd/completer/main.go
          cp README.md LICENSE build/linux-arm64/
          cd build/linux-arm64 && tar -czvf ../../discord-quest-phantom-linux-arm64.tar.gz . && cd ../..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF_NAME:-v1.0.0}
          if [ "$TAG_NAME" = "main" ]; then TAG_NAME="v1.0.0"; fi
          gh release create "$TAG_NAME" \
            discord-quest-phantom-windows-amd64.zip \
            discord-quest-phantom-linux-amd64.tar.gz \
            discord-quest-phantom-linux-arm64.tar.gz \
            --title "Discord Quest Phantom $TAG_NAME" \
            --notes "Autonomous dual-engine Discord Quest completer for Windows (x64) and Linux (x64, ARM64). Zero dependencies." \
            --draft=false \
            --prerelease=false || true
